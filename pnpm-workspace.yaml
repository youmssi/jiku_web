allowBuilds:
  '@parcel/watcher': false
  # Its postinstall downloads a platform binary used only to upload source maps at
  # build time. Left off for the same reason as the others here: installs stay
  # small and offline-tolerant. Flip to true when source-map upload is switched on
  # alongside SENTRY_AUTH_TOKEN.
  '@sentry/cli': false
  '@swc/core': false
  # fumadocs-mdx bundles source.config.ts with esbuild; its platform binary
  # comes from the @esbuild/* optional dependency, so the install script (a
  # binary check) is not needed.
  esbuild: false
  sharp: false
  unrs-resolver: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
  - '@parcel/watcher'
  - '@swc/core'

minimumReleaseAgeExclude:
  - '@next/env@16.4.3'
  - '@next/eslint-plugin-next@16.4.3'
  - '@next/swc-darwin-arm64@16.4.3'
  - '@next/swc-darwin-x64@16.4.3'
  - '@next/swc-linux-arm64-gnu@16.4.3'
  - '@next/swc-linux-arm64-musl@16.4.3'
  - '@next/swc-linux-x64-gnu@16.4.3'
  - '@next/swc-linux-x64-musl@16.4.3'
  - '@next/swc-win32-arm64-msvc@16.4.3'
  - '@next/swc-win32-x64-msvc@16.4.3'
  - eslint-config-next@16.4.3
  - next@16.4.3

# Security fixes for transitive dependencies whose parents do not yet ship them
# (pnpm audit, security review F-6). Each one is the smallest fixed version in
# the same major line; remove an entry once its parent depends on a fixed one.
