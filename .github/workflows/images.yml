name: Container image

# Builds the web image on every merge to `main` and publishes it to GHCR
# (ADR 107). NEXT_PUBLIC_* values are baked in at build time, so they come from
# the repository variables of the production environment. When the Dokploy
# deploy hook is configured, the new image is rolled out and the site checked.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: container-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish the web image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SUPPORT_EMAIL=${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
            NEXT_PUBLIC_SUPPORT_WHATSAPP=${{ vars.NEXT_PUBLIC_SUPPORT_WHATSAPP }}
            NEXT_PUBLIC_SALES_EMAIL=${{ vars.NEXT_PUBLIC_SALES_EMAIL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
            NEXT_PUBLIC_ERROR_TRACKING_DSN=${{ vars.NEXT_PUBLIC_ERROR_TRACKING_DSN }}
            NEXT_PUBLIC_ERROR_TRACKING_ENVIRONMENT=${{ vars.NEXT_PUBLIC_ERROR_TRACKING_ENVIRONMENT }}
            NEXT_PUBLIC_ERROR_TRACKING_RELEASE=${{ github.sha }}
            NEXT_PUBLIC_ERROR_BEACON_URL=${{ vars.NEXT_PUBLIC_ERROR_BEACON_URL }}
            NEXT_PUBLIC_UMAMI_SRC=${{ vars.NEXT_PUBLIC_UMAMI_SRC }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            NEXT_PUBLIC_ERROR_TRACKING_TRACES_SAMPLE_RATE=${{ vars.NEXT_PUBLIC_ERROR_TRACKING_TRACES_SAMPLE_RATE }}
            NEXT_PUBLIC_BING_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_BING_SITE_VERIFICATION }}
            NEXT_PUBLIC_YANDEX_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_YANDEX_SITE_VERIFICATION }}
            NEXT_PUBLIC_BRAND_PROFILES=${{ vars.NEXT_PUBLIC_BRAND_PROFILES }}
            NEXT_PUBLIC_PUBLISHER_NAME=${{ vars.NEXT_PUBLIC_PUBLISHER_NAME }}
            NEXT_PUBLIC_PUBLISHER_URL=${{ vars.NEXT_PUBLIC_PUBLISHER_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Roll out on the server
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.DEPLOY_TARGET == 'vps' }}
    steps:
      - name: Trigger the Dokploy deployment
        env:
          HOOK: ${{ secrets.DOKPLOY_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::DEPLOY_TARGET=vps but the DOKPLOY_DEPLOY_HOOK secret is missing." >&2
            exit 1
          fi
          # Dokploy only rolls out a GitHub-sourced compose for a push to its own
          # branch: an empty POST answers 301 "Branch Not Match" and deploys nothing.
          code=$(curl -s -o hook-response.json -w '%{http_code}' --max-time 30 -X POST "$HOOK" \
            -H 'Content-Type: application/json' -H 'X-GitHub-Event: push' \
            --data "{\"ref\":\"${GITHUB_REF}\",\"head_commit\":{\"message\":\"${GITHUB_REPOSITORY} ${GITHUB_SHA::7}\"}}" || true)
          cat hook-response.json 2>/dev/null; echo
          if [ "$code" != "200" ]; then
            echo "::error::Dokploy answered HTTP $code: the rollout did not start." >&2
            exit 1
          fi

      - name: Check the site answers
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          sleep 45
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null --max-time 20 -w '%{http_code}' "$SITE_URL/" || true)
            [ "$code" = "200" ] && echo "Site up." && exit 0
            echo "Attempt $attempt: HTTP $code, retrying in 15 s"
            sleep 15
          done
          echo "::error::The site does not answer after the rollout. Roll back from Dokploy (jiku_app docs/runbooks/incident-and-rollback.md)." >&2
          exit 1
